<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder image">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f7f2"/>
      <stop offset="1" stop-color="#e3e0d6"/>
    </linearGradient>
    <linearGradient id="kcase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dedbd1"/>
    </linearGradient>
    <radialGradient id="lens" cx=".38" cy=".34" r=".72">
      <stop offset="0" stop-color="#6d7a8c"/>
      <stop offset="1" stop-color="#22272f"/>
    </radialGradient>
    <filter id="kgrain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#kbg)"/>

  <!-- brick wall to mount on -->
  <g fill="#e6e1d5">
    <rect x="0" y="120" width="800" height="560"/>
  </g>
  <g stroke="#d6d0c1" stroke-width="4" opacity=".9">
