    <path d="M120 120v80M320 120v80M520 120v80M720 120v80M40 200v80M240 200v80M440 200v80M640 200v80
             M120 280v80M320 280v80M520 280v80M720 280v80M40 360v80M240 360v80M440 360v80M640 360v80
             M120 440v80M320 440v80M520 440v80M720 440v80M40 520v80M240 520v80M440 520v80M640 520v80"/>
  </g>

  <!-- bracket -->
  <rect x="150" y="292" width="90" height="30" rx="14" fill="#b9b1a0"/>
  <rect x="236" y="272" width="120" height="70" rx="18" fill="#cfc8b8"/>

  <!-- camera body -->
  <rect x="336" y="222" width="330" height="170" rx="60" fill="url(#kcase)" stroke="#cfc8b8" stroke-width="3"/>
  <rect x="336" y="222" width="330" height="52" rx="26" fill="#f6f3ea"/>

  <!-- lens -->
  <circle cx="646" cy="308" r="86" fill="#3c4250"/>
  <circle cx="646" cy="308" r="62" fill="url(#lens)"/>
  <circle cx="622" cy="286" r="18" fill="#cfe0ea" opacity=".55"/>

