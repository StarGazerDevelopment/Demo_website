<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder image">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6f0"/>
      <stop offset="1" stop-color="#e3ded1"/>
    </linearGradient>
    <linearGradient id="sheath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e3cc"/>
      <stop offset="1" stop-color="#cbb08a"/>
